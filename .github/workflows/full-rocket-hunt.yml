name: Full DEX-first crypto rocket scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      gecko_pages:
        description: GeckoTerminal pages per global list and each selected network pool family (1-3 recommended; 1-10 supported)
        required: false
        default: "3"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && 'crypto-prebreakout-validation' || 'crypto-prebreakout-scanner-memory' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Restore base runtime and v4.15.3 overlay
        run: |
          tar -xzf source/rocket-hunt-core-v4.15.2.tar.gz -C .
          tar -xzf source/rocket-hunt-v4.15.3-overlay.tar.gz -C .
          gzip -dc source/patch_forward_report.py.gz > source/patch_forward_report.py
          python source/patch_forward_report.py
          mkdir -p tests
          gzip -dc source/test_forward_24h_required_fields.py.gz > tests/test_forward_24h_required_fields.py
      - name: Extract v4.18 research overlay
        run: tar -xzf source/v418-research-overlay.tar.gz -C .
      - name: Install v4.18.1 forward-age guard and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/v418_pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = 'PIPELINE_VERSION = "4.18.0"'
          new = 'PIPELINE_VERSION = "4.18.1"'
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("Expected v4.18.0 pipeline version declaration was not found")
          test_path = Path("tests/test_v418_pipeline.py")
          test_text = test_path.read_text(encoding="utf-8")
          import_marker = "from scripts.v418_pipeline import (" + chr(10)
          if "    PIPELINE_VERSION," not in test_text:
              if import_marker not in test_text:
                  raise SystemExit("Could not locate v4.18 pipeline test import")
              test_text = test_text.replace(import_marker, import_marker + "    PIPELINE_VERSION," + chr(10), 1)
          old_assert = 'self.assertEqual(j["pipeline_version"], "4.18.0")'
          new_assert = 'self.assertEqual(j["pipeline_version"], PIPELINE_VERSION)'
          if old_assert in test_text:
              test_text = test_text.replace(old_assert, new_assert, 1)
          elif new_assert not in test_text:
              raise SystemExit("Could not locate pipeline-version assertion in baseline test")
          test_path.write_text(test_text, encoding="utf-8")
          PY
          gzip -dc source/v4181-forward-age-guard.py.gz > scripts/v418_forward_guard.py
          gzip -dc source/test_v4181-forward-age-guard.py.gz > tests/test_v418_forward_guard.py
      - name: Restore tracked scan and qualification modules before overlay hooks
        run: |
          git show HEAD:scripts/rocket_hunt.py > scripts/rocket_hunt.py
          git show HEAD:scripts/run_full_scan.py > scripts/run_full_scan.py
          git show HEAD:scripts/v418_pipeline.py > scripts/v418_pipeline.py
          git show HEAD:scripts/v418_forward_guard.py > scripts/v418_forward_guard.py
          git show HEAD:scripts/next_day_forecast.py > scripts/next_day_forecast.py
          git show HEAD:scripts/tp_gate.py > scripts/tp_gate.py
          git show HEAD:scripts/render_forward_watchlist_markdown.py > scripts/render_forward_watchlist_markdown.py
          git show HEAD:tests/test_v418_pipeline.py > tests/test_v418_pipeline.py
          git show HEAD:tests/test_v418_forward_guard.py > tests/test_v418_forward_guard.py
          git show HEAD:tests/test_forward_24h_required_fields.py > tests/test_forward_24h_required_fields.py
      - name: Install v4.19.0 collector and memory upgrade for validation
        run: |
          python -m scripts.v419_upgrade --install --repo-root .
          python -m scripts.v419_upgrade --self-test
          python -m scripts.v420_upgrade --install --repo-root .
          python -m scripts.v420_upgrade --self-test
          python -m scripts.v423_provider_expansion --install --repo-root .
          python -m scripts.v423_provider_expansion --self-test
          python -m scripts.v424_birdeye_free --install --repo-root .
          python -m scripts.v424_birdeye_free --self-test
          python -m scripts.v425_early_breakout --install --repo-root .
          python -m scripts.v425_early_breakout --self-test
      - name: Restore current tracked DEX safety integration after legacy archive extraction
        run: |
          git show HEAD:scripts/forward_24h_report.py > scripts/forward_24h_report.py
          git show HEAD:scripts/post_scan_audit.py > scripts/post_scan_audit.py
          git show HEAD:scripts/dex_onchain_evidence.py > scripts/dex_onchain_evidence.py
      - name: Verify DEX loss-pattern gate wiring
        run: |
          python - <<'PY'
          from scripts import dex_loss_guard, forward_24h_report
          import sys
          sys.path.insert(0, "scripts")
          import post_scan_audit
          import dex_onchain_evidence
          assert callable(dex_onchain_evidence.enrich_candidate)
          assert callable(post_scan_audit.audit_dex_loss_guard)
          assert callable(dex_loss_guard.evaluate_dex_candidate)
          assert callable(post_scan_audit.audit_dex_loss_guard)
          assert callable(forward_24h_report.enforce_dex_loss_guard)
          PY
      - name: Run all deterministic tests and CLI smoke checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m compileall -q scripts tests
          python scripts/rocket_hunt.py --help >/dev/null
          python scripts/run_full_scan.py --help >/dev/null
          python scripts/post_scan_audit.py --help >/dev/null
          python scripts/forward_24h_report.py --help >/dev/null
          python -m scripts.v418_pipeline --self-test --memory-dir /tmp/v418-self-test
          python -m scripts.v418_forward_guard --help >/dev/null
          python -m scripts.v418_fast_refresh --no-network --outdir /tmp/v418-fast-test --memory-dir /tmp/v418-fast-memory --run-id ci-smoke

  scan:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Restore base runtime and v4.15.3 overlay
        run: |
          tar -xzf source/rocket-hunt-core-v4.15.2.tar.gz -C .
          tar -xzf source/rocket-hunt-v4.15.3-overlay.tar.gz -C .
          gzip -dc source/patch_forward_report.py.gz > source/patch_forward_report.py
          python source/patch_forward_report.py
          mkdir -p tests
          gzip -dc source/test_forward_24h_required_fields.py.gz > tests/test_forward_24h_required_fields.py
          tar -xzf source/v418-research-overlay.tar.gz -C .
      - name: Install v4.18.1 forward-age guard
        run: |
          git show HEAD:scripts/v418_pipeline.py > scripts/v418_pipeline.py
          git show HEAD:scripts/v418_forward_guard.py > scripts/v418_forward_guard.py
          git show HEAD:scripts/rocket_hunt.py > scripts/rocket_hunt.py
          git show HEAD:scripts/run_full_scan.py > scripts/run_full_scan.py
          git show HEAD:scripts/next_day_forecast.py > scripts/next_day_forecast.py
          git show HEAD:scripts/tp_gate.py > scripts/tp_gate.py
          git show HEAD:scripts/render_forward_watchlist_markdown.py > scripts/render_forward_watchlist_markdown.py
          git show HEAD:tests/test_v418_pipeline.py > tests/test_v418_pipeline.py
          git show HEAD:tests/test_v418_forward_guard.py > tests/test_v418_forward_guard.py
          git show HEAD:tests/test_forward_24h_required_fields.py > tests/test_forward_24h_required_fields.py
      - name: Install v4.19.0 collector and v4.20.0 forward-watchlist overlays for production scan
        run: |
          python -m scripts.v419_upgrade --install --repo-root .
          python -m scripts.v419_upgrade --self-test
          python -m scripts.v420_upgrade --install --repo-root .
          python -m scripts.v420_upgrade --self-test
          python -m scripts.v423_provider_expansion --install --repo-root .
          python -m scripts.v423_provider_expansion --self-test
          python -m scripts.v424_birdeye_free --install --repo-root .
          python -m scripts.v424_birdeye_free --self-test
          python -m scripts.v425_early_breakout --install --repo-root .
          python -m scripts.v425_early_breakout --self-test
      - name: Restore current tracked DEX safety integration after legacy archive extraction
        run: |
          git show HEAD:scripts/forward_24h_report.py > scripts/forward_24h_report.py
          git show HEAD:scripts/post_scan_audit.py > scripts/post_scan_audit.py
          git show HEAD:scripts/dex_onchain_evidence.py > scripts/dex_onchain_evidence.py
      - name: Restore recent successful public-source checkpoints
        uses: actions/cache@v5
        with:
          path: rocket-run/checkpoints
          key: rocket-hunt-checkpoints-${{ github.run_id }}
          restore-keys: |
            rocket-hunt-checkpoints-
      - name: Restore persistent scanner memory branch
        run: |
          git fetch origin scanner-memory:refs/remotes/origin/scanner-memory
          git worktree add /tmp/scanner-memory refs/remotes/origin/scanner-memory
      - name: Run bounded preflight, DEX-first discovery and seven-venue CEX pass
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          DEXTOOLS_API_KEY: ${{ secrets.DEXTOOLS_API_KEY }}
          BIRDEYE_API_KEY: ${{ secrets.BIRDEYE_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CHAIN_RPC_URLS_JSON: ${{ secrets.CHAIN_RPC_URLS_JSON }}
          SCANNER_MEMORY_DIR: /tmp/scanner-memory
        run: |
          python scripts/run_full_scan.py \
            --outdir rocket-run \
            --timeout 8 \
            --workers 8 \
            --gecko-pages "${{ inputs.gecko_pages || '3' }}" \
            --network-sweep-limit 24 \
            --gecko-request-interval 12 \
            --retries 2 \
            --dex-search-limit 12 \
            --dex-lookup-limit 160 \
            --resume \
            --resume-max-age-seconds 900 \
            --max-runtime-minutes 150 \
            --defer-completion \
            --birdeye
      - name: Apply v4.18 quality controls and update learning memory
        run: python -m scripts.v418_pipeline --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
      - name: Apply forward-report pool-age qualification
        run: python -m scripts.v418_forward_guard --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
      - name: Apply v4.19.0 full-universe snapshot, network rotation and calibration
        run: python -m scripts.v419_upgrade --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
      - name: Run automatic DEX wallet, LP, security and route evidence audit
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CHAIN_RPC_URLS_JSON: ${{ secrets.CHAIN_RPC_URLS_JSON }}
          GOPLUS_ACCESS_TOKEN: ${{ secrets.GOPLUS_ACCESS_TOKEN }}
          ZEROX_API_KEY: ${{ secrets.ZEROX_API_KEY }}
          ROCKET_TAKER_ADDRESS: ${{ secrets.ROCKET_TAKER_ADDRESS }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          BLOCKSCOUT_PRO_API_KEY: ${{ secrets.BLOCKSCOUT_PRO_API_KEY }}
          BLOCKSCOUT_CHAIN_IDS_JSON: ${{ secrets.BLOCKSCOUT_CHAIN_IDS_JSON }}
        run: |
          python scripts/post_scan_audit.py \
            --report rocket-run/rocket-hunt.json \
            --markdown rocket-run/rocket-hunt.md \
            --timeout 8 --gecko-cvd-limit 4 --book-limit 4 \
            --security-limit 24 --router-limit 24
      - name: Rebuild the forward watchlist from the expanded full-universe rows
        env:
          SCANNER_MEMORY_DIR: /tmp/scanner-memory
        run: |
          # The report builder appends to --markdown, so initialize a fresh file.
          : > rocket-run/forward-24h-rocket.md
          python scripts/forward_24h_report.py \
            --report rocket-run/rocket-hunt.json \
            --markdown rocket-run/forward-24h-rocket.md \
            --out rocket-run/forward-24h-rocket.json \
            --dex-limit 140 --cex-limit 25 --timeout 8 --gecko-interval 6.2
          python -m scripts.v418_forward_guard --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
          python -m scripts.v419_upgrade --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
          python -m scripts.v423_provider_expansion --post-scan --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
          python -m scripts.v424_birdeye_free --post-scan --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
          python -m scripts.v425_early_breakout --post-scan --outdir rocket-run --memory-dir /tmp/scanner-memory --run-id "$GITHUB_RUN_ID"
          python scripts/render_forward_watchlist_markdown.py --input rocket-run/forward-24h-rocket.json --output rocket-run/forward-24h-rocket.md
          test -s rocket-run/forward-24h-rocket.json
          test -s rocket-run/forward-24h-rocket.md
          grep -q "^# Forward 24h Watchlist" rocket-run/forward-24h-rocket.md
          echo "Final forward JSON and Markdown are present in rocket-run/."
      - name: Persist compact forecast, outcome, rotation and calibration ledger
        run: |
          mkdir -p /tmp/scanner-memory/discovery /tmp/scanner-memory/forecasts /tmp/scanner-memory/outcomes /tmp/scanner-memory/provider-registries
          git -C /tmp/scanner-memory add discovery forecasts outcomes provider-registries provider-network-state.json memory-manifest.json network-rotation-state.json calibration-state.json hyperliquid-market-state.json birdeye-rotation-state.json birdeye-cu-ledger.json dexpaprika-request-ledger.json active-24h-watchlist.json completed-24h-watchlist.json
          if ! git -C /tmp/scanner-memory diff --cached --quiet; then
            git -C /tmp/scanner-memory -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Persist scanner memory for run ${GITHUB_RUN_ID}"
            git -C /tmp/scanner-memory push origin HEAD:refs/heads/scanner-memory
          else
            echo "No memory changes to persist."
          fi
      - name: Mark full scan completed and render final report
        run: |
          python scripts/run_full_scan.py --mark-complete --outdir rocket-run
          python scripts/render_forward_watchlist_markdown.py --input rocket-run/forward-24h-rocket.json --output rocket-run/forward-24h-rocket.md
          test "$(python -c 'import json; print(json.load(open("rocket-run/scan-status.json"))["status"])')" = "COMPLETED"
      - name: Upload scan report, audits and checkpoints
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rocket-hunt-${{ github.run_id }}
          path: rocket-run/
          if-no-files-found: warn
          retention-days: 14
